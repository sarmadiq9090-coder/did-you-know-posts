name: Render new post specs
on:
  push:
    paths: ["specs/**"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install emoji font and Pillow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null
          pip install -q pillow
      - name: Render specs to images
        run: python3 tools/render_specs.py
      - name: Commit rendered posts
        run: |
          git config user.name "post-bot"; git config user.email "post-bot@users.noreply.github.com"
          git add -A posts/ specs/
          git diff --cached --quiet || { git commit -m "Render new posts"; git pull --rebase -q; git push; }
