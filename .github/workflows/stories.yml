name: Publish story
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "question or post"
        type: choice
        options: [question, post]
        default: post
      dry_run:
        description: "Render + validate only (nothing is published)"
        type: boolean
        default: true
  push:
    paths: ["story_request.txt"]   # first word: question|post, add "dry" for a dry run
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Random delay (scheduled runs only, 0-25 min) so posts are not robot-exact
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1500 ))
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null
          pip install -q pillow
      - name: Decide what to post
        id: what
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_KIND: ${{ inputs.kind }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          kind=post; dry=""
          if [ "$EVENT" = "schedule" ]; then
            [ "$SCHEDULE" = "53 6 * * *" ] && kind=question
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            kind="$IN_KIND"; [ "$IN_DRY" = "true" ] && dry="--dry-run"
          else
            read -r kind flag < story_request.txt || true
            [ "$flag" = "dry" ] && dry="--dry-run"
          fi
          case "$kind" in question|post) ;; *) kind=post ;; esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"; echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "story: $kind $dry"
      - name: Make, validate and publish story
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          STORY_OUT: ${{ runner.temp }}/story_out
        run: |
          git pull -q --rebase || true
          python3 scripts/publish_story.py ${{ steps.what.outputs.kind }} ${{ steps.what.outputs.dry }}
      - name: Preview on the reel-previews pre-release (dry runs)
        if: steps.what.outputs.dry != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view reel-previews >/dev/null 2>&1 || gh release create reel-previews --prerelease \
            --title "Reel previews (tests, not published)" --notes "Preview sheets from the latest test runs."
          gh release upload reel-previews "${{ runner.temp }}"/story_out/*.jpg --clobber
      - name: Save progress
        if: always() && steps.what.outputs.dry == ''
        run: |
          git config user.name "post-bot"; git config user.email "post-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Published story"
          git pull --rebase -q; git push
