name: Publish reel
on:
  schedule:
    - cron: "37 12,18 * * *"   # ~3:37pm and 9:37pm Baghdad (UTC+3), between the image slots
  workflow_dispatch: {}
  push:
    paths: ["reel_request.txt"]
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg >/dev/null
          pip install -q numpy pillow
      - name: Make and publish reel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_reel.py
      - name: Save progress
        run: |
          git config user.name "post-bot"; git config user.email "post-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Published reel"
          git pull --rebase -q; git push
